version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: devverse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devverse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-devverse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devverse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devverse-network

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: devverse-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devverse-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: devverse-qdrant
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devverse-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devverse-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devverse}:${POSTGRES_PASSWORD:-devverse_secret}@postgres:5432/${POSTGRES_DB:-devverse}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      JWT_EXPIRY_MINUTES: 30
      REFRESH_TOKEN_EXPIRY_DAYS: 7
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - devverse-network

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devverse-celery-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devverse}:${POSTGRES_PASSWORD:-devverse_secret}@postgres:5432/${POSTGRES_DB:-devverse}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: celery -A tasks.celery_app worker --loglevel=debug --concurrency=4
    networks:
      - devverse-network

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devverse-celery-beat
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devverse}:${POSTGRES_PASSWORD:-devverse_secret}@postgres:5432/${POSTGRES_DB:-devverse}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tasks.celery_app beat --loglevel=info
    networks:
      - devverse-network

  # Flower (Celery Monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devverse-flower
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - celery-worker
    ports:
      - "5555:5555"
    command: celery -A tasks.celery_app flower --port=5555
    networks:
      - devverse-network

networks:
  devverse-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
